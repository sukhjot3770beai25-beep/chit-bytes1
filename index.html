<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chit-Bytes | Loading</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#fff;
}

.logo{
    position:absolute;
    top:25px;
    left:35px;
    font-size:30px;
    font-weight:700;
    color:#222;
    text-decoration:none;
}

.logo span{
    color:#ff5a3c;
}

.center{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.center h1{
    font-size:60px;
    margin-bottom:10px;
}

.center h2{
    font-size:24px;
    min-height:36px;
    color:#222;
    margin-bottom:8px;
}

.center p{
    color:#666;
    margin-bottom:25px;
}

.container{
    width:400px;
    height:18px;
    border:2px solid #ff5a3c;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    width:0;
    height:100%;
    background:#ff5a3c;
    animation:load 5s linear forwards;
}

.footer{
    position:absolute;
    bottom:35px;
    width:100%;
    text-align:center;
    color:#888;
    font-size:14px;
}

.center h2::after{
    content:"|";
    color:#ff5a3c;
    margin-left:2px;
    animation:blink 0.8s infinite;
}

@keyframes blink{
    50%{ opacity:0; }
}

@keyframes load{
    from{
        width:0;
    }
    to{
        width:100%;
    }
}

</style>

</head>

<body>

<a href="home.html" class="logo">
    Chit<span>-Bytes</span>
</a>

<div class="center">

    <!-- <h1>🍔</h1> -->

    <!-- js/loading.js types the text here -->
    <h2 id="typeText"></h2>

    <p>Loading delicious experiences...</p>

    <div class="container">
        <div class="fill"></div>
    </div>

</div>

<div class="footer">
    Powered by Chit-Bytes
</div>

<script src="js/loading.js"></script>
</body>
</html>
