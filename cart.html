<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chit-Bytes | Your Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Header ===== -->
<header class="site-header">
  <a href="home.html" class="logo">Chit<span>-Bytes</span></a>
  <div class="location-box">📍 Patiala, Punjab</div>
  <nav class="nav-links" style="margin-left:auto;">
    <a href="home.html">Home</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="login.html" class="btn-signup">Log in</a>
  </nav>
</header>

<!-- ===== Cart ===== -->
<section class="cart-page">
  <h1>Your Cart</h1>
  <div class="cart-restaurant-name">Ordering from <strong>Punjabi Tadka</strong></div>

  <div class="cart-item">
    <div>
      <span class="veg-dot nonveg"></span>
      <span class="cart-item-name">Butter Chicken</span>
      <div class="cart-item-price">₹320 x 1 = ₹320</div>
    </div>
    <div class="cart-item-right">
      <span>Qty: 1</span>
      <a class="remove-btn" href="#">Remove</a>
    </div>
  </div>

  <div class="cart-item">
    <div>
      <span class="veg-dot"></span>
      <span class="cart-item-name">Dal Makhani</span>
      <div class="cart-item-price">₹220 x 1 = ₹220</div>
    </div>
    <div class="cart-item-right">
      <span>Qty: 1</span>
      <a class="remove-btn" href="#">Remove</a>
    </div>
  </div>

  <div class="cart-item">
    <div>
      <span class="veg-dot"></span>
      <span class="cart-item-name">Tandoori Roti</span>
      <div class="cart-item-price">₹25 x 2 = ₹50</div>
    </div>
    <div class="cart-item-right">
      <span>Qty: 2</span>
      <a class="remove-btn" href="#">Remove</a>
    </div>
  </div>

  <div class="bill-summary">
    <div class="bill-row"><span>Item total</span><span>₹590</span></div>
    <div class="bill-row"><span>Delivery fee</span><span>₹40</span></div>
    <div class="bill-row"><span>Taxes & charges</span><span>₹30</span></div>
    <div class="bill-row total"><span>To pay</span><span>₹660</span></div>
  </div>

  <a class="place-order-btn" href="track.html" style="display:block; text-align:center;">Place Order · ₹660</a>
</section>

</body>
</html>
